  <path d="M206,474 C216,474 216,409 226,409" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
  <path d="M206,474 C216,474 216,435 226,435" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
  <path d="M206,474 C216,474 216,487 226,487" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
  <path d="M206,474 C216,474 216,513 226,513" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
