  <path d="M206,635 C216,635 216,687 226,687" fill="none" stroke="#85B7EB" stroke-width="0.75"/>

  <path d="M206,770 C216,770 216,731 226,731" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
  <path d="M206,770 C216,770 216,757 226,757" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
