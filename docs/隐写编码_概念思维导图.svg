<svg viewBox="0 0 680 870" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;background:#FFFFFF">
  <title>1.1 隐写编码 思维导图</title>
  <desc>张卫明等《多媒体隐写研究进展》1.1 节的思维导图:核心问题与嵌入效率,以及常数代价、两级代价、多级代价、非二元代价、非加性代价五种编码模型的发展脉络与代表方法。</desc>

  <rect x="0" y="0" width="680" height="870" fill="#FFFFFF"/>

  <rect x="40" y="30" width="210" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="145" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">1.1 隐写编码</text>

  <text x="266" y="42" dominant-baseline="central" font-size="12" fill="#5F5E5A">核心问题:给定载荷率下,最小化嵌入引入的载体失真</text>
  <text x="266" y="60" dominant-baseline="central" font-size="12" fill="#5F5E5A">抽象为特殊的率失真编码问题(Zhang 和 Li, 2008)</text>
  <text x="266" y="78" dominant-baseline="central" font-size="12" fill="#5F5E5A">评判标准:嵌入效率 = 信息量 / 修改总代价,越高越好</text>

  <path d="M40,90 L40,770" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
  <path d="M40,165 L56,165" fill="none" stroke="#85B7EB" stroke-width="0.75"/>
