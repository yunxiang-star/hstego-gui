  <rect x="56" y="146" width="150" height="38" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="131" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">1.1.1</text>
  <text x="131" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">常数代价编码</text>

  <rect x="56" y="294" width="150" height="38" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="131" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">1.1.2</text>
  <text x="131" y="320" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">两级代价(湿纸)</text>

  <rect x="56" y="455" width="150" height="38" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="131" y="467" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">1.1.3</text>
  <text x="131" y="481" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">多级代价编码</text>

  <rect x="56" y="616" width="150" height="38" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="131" y="628" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">1.1.4</text>
  <text x="131" y="642" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">非二元代价编码</text>

  <rect x="56" y="751" width="150" height="38" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="131" y="763" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">1.1.5</text>
  <text x="131" y="777" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">非加性代价编码</text>

  <text x="232" y="113" dominant-baseline="central" font-size="12" fill="#2C2C2A">假设所有元素修改代价相同 ⇒ 最小化修改点数</text>
  <text x="232" y="139" dominant-baseline="central" font-size="12" fill="#2C2C2A">设计范式:矩阵编码,用奇偶校验矩阵完成嵌入<tspan font-size="11" fill="#5F5E5A"> · Crandall 1998</tspan></text>
  <text x="232" y="165" dominant-baseline="central" font-size="12" fill="#2C2C2A">最早基于 Hamming 码 → 经典 F5 算法<tspan font-size="11" fill="#5F5E5A"> · Westfeld 2001</tspan></text>
  <text x="232" y="191" dominant-baseline="central" font-size="12" fill="#2C2C2A">推导率失真界后提出更优矩阵编码<tspan font-size="11" fill="#5F5E5A"> · Galand 2003 / Bierbrauer 2008</tspan></text>
  <text x="232" y="217" dominant-baseline="central" font-size="12" fill="#2C2C2A">BCH 码改善性能,LDGM 码兼顾容量与效率<tspan font-size="11" fill="#5F5E5A"> · Munuera 2007</tspan></text>

  <text x="232" y="261" dominant-baseline="central" font-size="12" fill="#2C2C2A">载体元素分"干 / 湿"两类:湿点禁改,干点代价一致</text>
  <text x="232" y="287" dominant-baseline="central" font-size="12" fill="#2C2C2A">接收方无需知道湿点位置即可提取消息</text>
  <text x="232" y="313" dominant-baseline="central" font-size="12" fill="#2C2C2A">求解:首先给出高斯消元法<tspan font-size="11" fill="#5F5E5A"> · Fridrich 等 2005b</tspan></text>
  <text x="232" y="339" dominant-baseline="central" font-size="12" fill="#2C2C2A">稀疏线性码加速求解;Meet-in-the-Middle 提升效率<tspan font-size="11" fill="#5F5E5A"> · 2005a / 2006</tspan></text>
  <text x="232" y="365" dominant-baseline="central" font-size="12" fill="#2C2C2A">Wet ZZW:大嵌入率湿纸码生成小嵌入率码族<tspan font-size="11" fill="#5F5E5A"> · Filler 2009</tspan></text>

  <text x="232" y="409" dominant-baseline="central" font-size="12" fill="#2C2C2A">湿纸模型刻画不够精细 ⇒ 每个元素可定义任意修改代价</text>
  <text x="232" y="435" dominant-baseline="central" font-size="12" fill="#2C2C2A">Hamming 编码允许多个修改,并推广至 BCH<tspan font-size="11" fill="#5F5E5A"> · Kim 2007 / Sachnev 2009</tspan></text>
  <path d="M236 457 L240.5 461.5 L236 466 L231.5 461.5 Z" fill="#BA7517"/>
  <text x="248" y="461" dominant-baseline="central" font-size="12" font-weight="500" fill="#854F0B">STC 校验网格编码(卷积码)逼近嵌入效率上界<tspan font-size="11" font-weight="400"> · Filler 等 2011</tspan></text>
  <text x="232" y="487" dominant-baseline="central" font-size="12" fill="#2C2C2A">极化码方案在多级代价模型下仍存在局限<tspan font-size="11" fill="#5F5E5A"> · Diouf 等 2018</tspan></text>
  <text x="232" y="513" dominant-baseline="central" font-size="12" fill="#2C2C2A">DualSTC:再嵌一层 STC 做载密恢复,抗有损更强<tspan font-size="11" fill="#5F5E5A"> · Kin-Cleaves 2018</tspan></text>
  <text x="232" y="539" dominant-baseline="central" font-size="12" fill="#2C2C2A">网格码用于生成式隐写:线性约束下从指定分布采样<tspan font-size="11" fill="#5F5E5A"> · Nakajima 2020</tspan></text>

  <text x="232" y="583" dominant-baseline="central" font-size="12" fill="#2C2C2A">二元码每元素最多 1 bit;±1 修改可达 log2(3) bit,三元效率更高</text>
  <text x="232" y="609" dominant-baseline="central" font-size="12" fill="#2C2C2A">难点:±1 本质属三嵌入,而三元编码计算复杂度很高</text>
  <text x="232" y="635" dominant-baseline="central" font-size="12" fill="#2C2C2A">图着色理论构造 ±1 编码<tspan font-size="11" fill="#5F5E5A"> · Fridrich &amp; Lisonek 2007</tspan></text>
  <text x="232" y="661" dominant-baseline="central" font-size="12" fill="#2C2C2A">像素两两成对,以像素值对为单位嵌入<tspan font-size="11" fill="#5F5E5A"> · Mielikainen 2006</tspan></text>
  <text x="232" y="687" dominant-baseline="central" font-size="12" fill="#2C2C2A">双层 STC 使 STC 支持 ±1 嵌入,成为最普及工具,可扩至 ±2<tspan font-size="11" fill="#5F5E5A"> · Filler 2011</tspan></text>

  <text x="232" y="731" dominant-baseline="central" font-size="12" fill="#2C2C2A">加性代价假设各元素代价相互独立 —— 对真实情况的简化</text>
  <text x="232" y="757" dominant-baseline="central" font-size="12" fill="#2C2C2A">目标:考虑隐写修改之间的相互影响,最小化非加性代价</text>
  <text x="232" y="783" dominant-baseline="central" font-size="12" fill="#2C2C2A">2013 年"23 个公开问题"中被列为首位</text>
  <text x="232" y="809" dominant-baseline="central" font-size="12" fill="#2C2C2A">动态 STC:译码中依已发生修改动态调整代价<tspan font-size="11" fill="#5F5E5A"> · Kin-Cleaves 2018</tspan></text>

  <text x="40" y="826" dominant-baseline="central" font-size="11" fill="#888780">◆ 里程碑方法    · 后为文献出处    ⇒ 等价 / 推导关系</text>
</svg>
